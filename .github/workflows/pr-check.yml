name: PR Gate — Verified Commit + Security Scan

on:
  pull_request:
    branches:
      - main
      - prod

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Verify every commit in the PR is GPG/SSH signed
  # ─────────────────────────────────────────────
  verify-commits:
    name: Verify Commit Signatures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check all commits are verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Fetching commits for PR #$PR_NUMBER..."
          COMMITS=$(gh api repos/$REPO/pulls/$PR_NUMBER/commits --paginate --jq '.[].sha')
          UNVERIFIED=()

          for SHA in $COMMITS; do
            VERIFIED=$(gh api repos/$REPO/commits/$SHA --jq '.commit.verification.verified')
            echo "Commit $SHA — verified: $VERIFIED"
            if [ "$VERIFIED" != "true" ]; then
              UNVERIFIED+=($SHA)
            fi
          done

          if [ ${#UNVERIFIED[@]} -ne 0 ]; then
            echo ""
            echo "❌ The following commits are NOT verified (unsigned):"
            for SHA in "${UNVERIFIED[@]}"; do echo "  - $SHA"; done
            echo ""
            echo "All commits must be signed with a verified GPG or SSH key."
            echo "See: https://docs.github.com/en/authentication/managing-commit-signature-verification"
            exit 1
          fi

          echo "✅ All commits are verified."

  # ─────────────────────────────────────────────
  # JOB 2: Aggressive Loader/Rider Obfuscation Detection
  #
  # Zero-loophole design:
  #   • Scans every JS/TS file changed OR added in the PR
  #   • Scans ALL package.json files for malicious lifecycle hooks
  #   • 30 patterns across 4 categories:
  #       FATAL   — single hit blocks immediately, no threshold
  #       SCORED  — accumulate; threshold = 1 (any 2 non-fatal hits block)
  #       ENTROPY — Shannon entropy > 5.0 on any 512-char window blocks
  #       LINE    — single line > 500 chars blocks (packed/minified payload)
  #   • Reports exact line numbers for every hit
  #   • .obfuscation-ignore is audited and its entries logged to CI
  #   • Threshold intentionally set to 1 — two independent non-fatal
  #     signals together are sufficient proof of obfuscation
  # ─────────────────────────────────────────────
  obfuscation-scan:
    name: Obfuscated Script Detection
    runs-on: ubuntu-latest
    needs: verify-commits

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed JS/TS and package.json files
        id: changed-files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # JS/TS files
          gh api repos/$REPO/pulls/$PR_NUMBER/files --paginate \
            --jq '.[].filename' \
            | grep -E '\.(js|ts|mjs|cjs|jsx|tsx)$' \
            > /tmp/changed_js_files.txt || true

          # package.json files — separately scanned for lifecycle hook injection
          gh api repos/$REPO/pulls/$PR_NUMBER/files --paginate \
            --jq '.[].filename' \
            | grep -E '(^|/)package\.json$' \
            > /tmp/changed_pkg_files.txt || true

          echo "--- JS/TS files ---"
          cat /tmp/changed_js_files.txt || echo "(none)"
          echo "--- package.json files ---"
          cat /tmp/changed_pkg_files.txt || echo "(none)"

      - name: Audit .obfuscation-ignore entries
        run: |
          # Make every ignore entry visible in CI — no silent whitelisting
          if [ -f ".obfuscation-ignore" ]; then
            echo "⚠️  .obfuscation-ignore is present. The following paths are excluded from scanning:"
            cat .obfuscation-ignore
            echo ""
            echo "These exclusions must be reviewed and approved by a security owner."
          else
            echo "ℹ️  No .obfuscation-ignore file found — all files will be scanned."
          fi

      - name: Scan package.json lifecycle hooks
        run: |
          node - << 'EOF'
          const fs = require('fs');

          // Lifecycle hooks that can execute arbitrary code silently
          const DANGEROUS_HOOKS = [
            'preinstall', 'install', 'postinstall',
            'prepack', 'prepare', 'prepublish',
            'preuninstall', 'uninstall', 'postuninstall',
          ];

          // Payloads that should never appear in lifecycle scripts
          const SUSPICIOUS_CMDS = [
            /\bcurl\b/, /\bwget\b/, /\bfetch\b/,
            /\beval\b/, /\bexec\b/, /\bspawn\b/,
            /\bnode\s+-e\b/, /\bbash\s+-c\b/, /\bsh\s+-c\b/,
            /base64\s+--decode/, /base64\s+-d/,
            /\bpython[23]?\s+-c\b/,
            /\bnc\b|\bnetcat\b/,               // netcat reverse shell
            /\/dev\/tcp\//,                     // bash TCP redirect
            /\bchmod\s+[+]?x\b/,               // make-executable
            /127\.0\.0\.1|0\.0\.0\.0/,          // loopback C2
            /https?:\/\/(?!registry\.npmjs\.org|nodejs\.org)/,  // external URLs
          ];

          const listPath = '/tmp/changed_pkg_files.txt';
          if (!fs.existsSync(listPath)) process.exit(0);

          const pkgFiles = fs.readFileSync(listPath, 'utf8')
            .split('\n').map(f => f.trim()).filter(Boolean);

          if (pkgFiles.length === 0) {
            console.log('No package.json files to scan.');
            process.exit(0);
          }

          let blocked = false;

          for (const file of pkgFiles) {
            if (!fs.existsSync(file)) continue;

            let pkg;
            try {
              pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (e) {
              console.log(`  [WARN] Could not parse ${file}: ${e.message}`);
              continue;
            }

            const scripts = pkg.scripts || {};
            const findings = [];

            for (const hook of DANGEROUS_HOOKS) {
              if (!scripts[hook]) continue;
              const val = scripts[hook];

              const matched = SUSPICIOUS_CMDS.filter(rx => rx.test(val));
              if (matched.length > 0) {
                findings.push({ hook, value: val, patterns: matched.map(r => r.toString()) });
              }
            }

            if (findings.length > 0) {
              blocked = true;
              console.log(`\n🚨 FLAGGED  ${file}`);
              for (const { hook, value, patterns } of findings) {
                console.log(`    Hook     : scripts.${hook}`);
                console.log(`    Command  : ${value}`);
                console.log(`    Triggers : ${patterns.join(', ')}`);
              }
            } else {
              console.log(`\n✅ clean    ${file}`);
            }
          }

          if (blocked) {
            console.log('\n❌ Malicious lifecycle hook detected in package.json.');
            process.exit(1);
          }
          console.log('\n✅ All package.json lifecycle hooks are clean.');
          process.exit(0);
          EOF

      - name: Run obfuscation pattern scanner
        id: obfuscation-check
        run: |
          node - << 'EOF'
          const fs = require('fs');

          // ════════════════════════════════════════════════════════════
          // PATTERN DEFINITIONS
          // fatal=true  → single hit = immediate block, no threshold
          // fatal=false → +1 to suspicion score; threshold = 1 (any 2 = block)
          // ════════════════════════════════════════════════════════════
          const PATTERNS = [

            // ── CATEGORY A: Global / runtime hijacking (all FATAL) ───────
            {
              id: 'GLOBAL_KEY_INJECT',
              description: 'global["!"] short-symbol key injection',
              regex: /global\[['"][!@#$%^&*|~`]{1,3}['"]\]\s*=/,
              fatal: true,
            },
            {
              id: 'GLOBAL_REQUIRE_HIJACK',
              description: 'global[varName] = require — steals require reference',
              regex: /global\[\s*\w+\[\d+\]\s*\]\s*=\s*require/,
              fatal: true,
            },
            {
              id: 'GLOBAL_MODULE_HIJACK',
              description: 'global[varName] = module — steals module reference',
              regex: /global\[\s*\w+\[\d+\]\s*\]\s*=\s*module/,
              fatal: true,
            },
            {
              id: 'NEW_FUNCTION_CTOR',
              description: 'new Function(...) — dynamic code generation',
              regex: /\bnew\s+Function\s*\(/,
              fatal: true,
            },
            {
              id: 'CONSTRUCTOR_CHAIN',
              description: '.constructor.constructor( — Function ctor via prototype chain',
              regex: /\.constructor\.constructor\s*\(/,
              fatal: true,
            },
            {
              id: 'SETTIMEOUT_STRING_ARG',
              description: 'setTimeout/setInterval with string — eval-equivalent',
              regex: /\bset(?:Timeout|Interval)\s*\(\s*["'`]/,
              fatal: true,
            },
            {
              id: 'PROCESS_BINDING',
              description: 'process.binding() — low-level Node internal bypass',
              regex: /\bprocess\.binding\s*\(/,
              fatal: true,
            },
            {
              id: 'VM_RUN_CONTEXT',
              description: 'vm.runInNewContext / vm.runInThisContext — sandbox escape',
              regex: /\bvm\.run(?:In(?:New|This)Context|Script)\s*\(/,
              fatal: true,
            },
            {
              id: 'CHILD_PROCESS_EXEC',
              description: 'child_process exec/spawn with dynamic arg — RCE vector',
              regex: /(?:exec|execSync|spawn|spawnSync)\s*\(\s*(?!\s*["'`][a-zA-Z\s\-]{1,40}["'`])/,
              fatal: true,
            },
            {
              id: 'BUFFER_BASE64_DECODE',
              description: 'Buffer.from(x, "base64").toString() — in-process payload decode',
              regex: /Buffer\.from\s*\([^)]+,\s*['"]base64['"]\s*\)\.toString/,
              fatal: true,
            },
            {
              id: 'ATOB_PAYLOAD',
              description: 'atob() decode — base64 payload execution in browser/Node context',
              regex: /\batob\s*\(\s*(?!\s*["'`][A-Za-z0-9+\/]{0,20}={0,2}["'`]\s*\))/,
              fatal: true,
            },
            {
              id: 'HEX_ESCAPE_CLUSTER',
              description: 'Dense \\xNN hex escape sequences (5+ consecutive) — never legitimate in source',
              regex: /(?:\\x[0-9a-fA-F]{2}){5,}/,
              fatal: true,
            },
            {
              id: 'DYNAMIC_REQUIRE_VAR',
              description: 'require(variable) — module name hidden in variable',
              regex: /\brequire\s*\(\s*(?!['"`])[a-zA-Z_$][\w$]*(?:\[[\w$"']+\])?\s*\)/,
              fatal: true,
            },
            {
              id: 'PROTO_POLLUTION',
              description: '__proto__ / Object.prototype mutation — prototype pollution',
              regex: /(?:\.__proto__\s*=|Object\.prototype\[\s*["'][^"']+["']\s*\]\s*=)/,
              fatal: true,
            },

            // ── CATEGORY B: Encoding / packing patterns (SCORED) ─────────
            {
              id: 'HEX_VAR_NAME',
              description: 'Hex-prefixed obfuscated variable name (_$_1e42)',
              regex: /\b_\$_[0-9a-f]{4,}\b/,
              fatal: false,
            },
            {
              id: 'SPLIT_JOIN_CHAIN',
              description: 'Chained .split().join() decoder (3+ pairs)',
              regex: /\.split\(\w+\)\.join\(\w+\)(?:\.split\(\w+\)\.join\(\w+\)){2,}/,
              fatal: false,
            },
            {
              id: 'FROM_CHAR_CODE',
              description: 'String.fromCharCode — character-level encoding',
              regex: /String\.fromCharCode\s*\(\s*\d+/,
              fatal: false,
            },
            {
              id: 'NUMERIC_CHARCODE_ARRAY',
              description: 'Numeric char-code array [104,101,108,108,111] — string hiding',
              regex: /\[\s*(?:\d{2,3}\s*,\s*){6,}\d{2,3}\s*\]/,
              fatal: false,
            },
            {
              id: 'SEEDED_IIFE_SHUFFLE',
              description: 'IIFE with large numeric seed + charAt — classic packer',
              regex: /\(function\s*\(\w,\s*\w\)\s*\{[^}]*\.length[^}]*charAt[^}]*\}\)\s*\(\s*["'][^"']+["']\s*,\s*\d{5,}\s*\)/,
              fatal: false,
            },
            {
              id: 'CHAR_AT_SWAP_LOOP',
              description: 'Fisher-Yates char-swap loop over string (shuffle obfuscator)',
              regex: /for\s*\(\s*var\s+\w\s*=\s*0\s*;[^;]*;[^)]*\)\s*\{[^}]*charAt[^}]*=\s*[^}]*\}/,
              fatal: false,
            },
            {
              id: 'DYNAMIC_EVAL_CHAIN',
              description: 'Nested dynamic call chain — payload reconstruction + eval',
              regex: /\w+\s*=\s*\w+\(\s*\w+\s*,\s*\w+\(\w+\)\s*\)\s*;\s*\w+\(\d+\)/,
              fatal: false,
            },
            {
              id: 'BASE64_INLINE_BLOB',
              description: '200+ char base64-only string literal — encoded payload',
              regex: /["'][A-Za-z0-9+\/]{200,}={0,2}["']/,
              fatal: false,
            },
            {
              id: 'UNICODE_ESCAPE_CLUSTER',
              description: 'Dense \\uXXXX Unicode escapes (4+ consecutive)',
              regex: /(?:\\u[0-9a-fA-F]{4}){4,}/,
              fatal: false,
            },
            {
              id: 'DECODE_URI_PAYLOAD',
              description: 'decodeURIComponent on long percent-encoded string',
              regex: /decodeURIComponent\s*\(\s*["'](?:%[0-9a-fA-F]{2}){10,}/,
              fatal: false,
            },
            {
              id: 'UNESCAPE_CALL',
              description: 'unescape() — legacy percent-decode, no legitimate modern use',
              regex: /\bunescape\s*\(\s*["']/,
              fatal: false,
            },
            {
              id: 'COMPUTED_ARRAY_LOOKUP',
              description: 'a[b[0]] name-table lookup — loader/rider fingerprint',
              regex: /\w+\[\s*\w+\[\s*\d+\s*\]\s*\]/,
              fatal: false,
            },
            {
              id: 'EVAL_CALL',
              description: 'Direct eval() call — dynamic code execution',
              regex: /\beval\s*\(/,
              fatal: false,
            },
            {
              id: 'DEFINE_GETTER_ABUSE',
              description: '__defineGetter__ / defineProperty with getter — code hiding',
              regex: /(?:__defineGetter__|Object\.defineProperty)\s*\([^)]*(?:get\s*:\s*function|get\s*\()/,
              fatal: false,
            },
            {
              id: 'ARGUMENTS_CALLEE',
              description: 'arguments.callee — self-reference used in obfuscators',
              regex: /\barguments\.callee\b/,
              fatal: false,
            },
          ];

          // ── THRESHOLD ──────────────────────────────────────────────────────
          // Score threshold = 1 means ANY 2 non-fatal pattern hits blocks the file.
          // Each non-fatal match = +1. Block when score > SCORE_THRESHOLD.
          const SCORE_THRESHOLD = 1;

          // ── ENTROPY CONFIG ─────────────────────────────────────────────────
          // Shannon entropy > 5.2 on any 512-char sliding window = obfuscated content.
          // Normal source code scores 3.5–4.8; packed/encrypted content scores 5.5+.
          const ENTROPY_WINDOW    = 512;
          const ENTROPY_THRESHOLD = 5.2;
          const ENTROPY_STEP      = 256;   // step size for sliding window

          // ── LINE LENGTH CONFIG ─────────────────────────────────────────────
          // A single line > 500 chars strongly indicates a minified/packed payload.
          const MAX_LINE_LENGTH = 500;

          // ── .obfuscation-ignore ────────────────────────────────────────────
          let ignoreList = [];
          if (fs.existsSync('.obfuscation-ignore')) {
            ignoreList = fs.readFileSync('.obfuscation-ignore', 'utf8')
              .split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
            console.log(`⚠️  Ignoring ${ignoreList.length} path(s) from .obfuscation-ignore`);
            ignoreList.forEach(p => console.log(`    → ${p}`));
            console.log('');
          }

          // ── Helpers ────────────────────────────────────────────────────────
          function shannonEntropy(str) {
            const freq = {};
            for (const ch of str) freq[ch] = (freq[ch] || 0) + 1;
            const len = str.length;
            return -Object.values(freq).reduce((acc, f) => {
              const p = f / len;
              return acc + p * Math.log2(p);
            }, 0);
          }

          function maxWindowEntropy(content) {
            let max = 0;
            for (let i = 0; i + ENTROPY_WINDOW <= content.length; i += ENTROPY_STEP) {
              const e = shannonEntropy(content.slice(i, i + ENTROPY_WINDOW));
              if (e > max) max = e;
            }
            // If file is shorter than one window, score the whole thing
            if (content.length < ENTROPY_WINDOW) {
              max = shannonEntropy(content);
            }
            return max;
          }

          function findPatternLines(content, regex) {
            const lines = content.split('\n');
            const hits = [];
            lines.forEach((line, idx) => {
              if (regex.test(line)) hits.push(idx + 1);
            });
            return hits;
          }

          // ── Load file list ─────────────────────────────────────────────────
          const listPath = '/tmp/changed_js_files.txt';
          if (!fs.existsSync(listPath)) {
            console.log('No changed JS/TS files found — nothing to scan.');
            process.exit(0);
          }

          const allFiles = fs.readFileSync(listPath, 'utf8')
            .split('\n').map(f => f.trim()).filter(Boolean);

          const files = allFiles.filter(f => !ignoreList.includes(f));
          const skipped = allFiles.filter(f => ignoreList.includes(f));

          if (skipped.length > 0) {
            console.log(`⚠️  Skipping ${skipped.length} ignored file(s):`);
            skipped.forEach(f => console.log(`    → ${f}`));
            console.log('');
          }

          if (files.length === 0) {
            console.log('No JS/TS files to scan after applying ignore list.');
            process.exit(0);
          }

          // ── Scan ───────────────────────────────────────────────────────────
          let blocked = false;
          const flagged = [];

          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.log(`  [SKIP] ${file} — not on disk (deleted in PR?)`);
              continue;
            }

            const content     = fs.readFileSync(file, 'utf8');
            const lines       = content.split('\n');
            const hits        = [];
            let   fatalHit    = false;
            let   score       = 0;
            const lineReports = [];   // { patternId, lines: [n, ...] }

            // ① Pattern scan
            for (const p of PATTERNS) {
              if (p.regex.test(content)) {
                const matchedLines = findPatternLines(content, p.regex);
                hits.push(p);
                lineReports.push({ id: p.id, lines: matchedLines });
                if (p.fatal) {
                  fatalHit = true;
                } else {
                  score++;
                }
              }
            }

            // ② Entropy scan
            let entropyFlag = false;
            let maxEntropy  = 0;
            if (content.length >= 64) {
              maxEntropy  = maxWindowEntropy(content);
              entropyFlag = maxEntropy > ENTROPY_THRESHOLD;
            }

            // ③ Line-length scan
            const longLines = lines
              .map((l, i) => ({ n: i + 1, len: l.length }))
              .filter(({ len }) => len > MAX_LINE_LENGTH);

            const shouldFlag = fatalHit
              || score > SCORE_THRESHOLD
              || entropyFlag
              || longLines.length > 0;

            if (shouldFlag) {
              blocked = true;
              flagged.push({ file, hits, score, fatalHit, lineReports,
                             maxEntropy, entropyFlag, longLines });
            }

            // Per-file summary
            const status = shouldFlag ? '🚨 FLAGGED' : '✅ clean';
            console.log(`\n${status}  ${file}`);

            if (hits.length > 0) {
              hits.forEach(h => {
                const tag   = h.fatal ? '[FATAL]' : '[+1]';
                const lrpt  = lineReports.find(r => r.id === h.id);
                const lnStr = lrpt && lrpt.lines.length
                  ? ` @ line(s) ${lrpt.lines.slice(0, 5).join(', ')}${lrpt.lines.length > 5 ? '…' : ''}`
                  : '';
                console.log(`    ${tag}  ${h.id}${lnStr}: ${h.description}`);
              });
              console.log(`    Score: ${score}/${SCORE_THRESHOLD + 1} needed${fatalHit ? ' + FATAL' : ''}`);
            }

            if (entropyFlag) {
              console.log(`    [ENTROPY]  Max window entropy ${maxEntropy.toFixed(3)} > ${ENTROPY_THRESHOLD} threshold`);
            }

            if (longLines.length > 0) {
              console.log(`    [LONGLINE] ${longLines.length} line(s) exceed ${MAX_LINE_LENGTH} chars:`);
              longLines.slice(0, 3).forEach(({ n, len }) =>
                console.log(`               Line ${n}: ${len} chars`));
            }
          }

          // ── Final verdict ─────────────────────────────────────────────────
          if (blocked) {
            console.log('\n' + '═'.repeat(64));
            console.log('❌  OBFUSCATION SCAN FAILED');
            console.log('═'.repeat(64));
            console.log(`${flagged.length} file(s) blocked:\n`);

            for (const { file, hits, score, fatalHit,
                          maxEntropy, entropyFlag, longLines } of flagged) {
              console.log(`  📄 ${file}`);
              console.log(`     Patterns  : ${hits.length > 0
                ? hits.map(h => `${h.fatal ? '⚠️ ' : ''}${h.id}`).join(', ')
                : '(none)'}`);
              console.log(`     Score     : ${score}`);
              console.log(`     Fatal hit : ${fatalHit}`);
              if (entropyFlag)
                console.log(`     Entropy   : ${maxEntropy.toFixed(3)} (threshold ${ENTROPY_THRESHOLD})`);
              if (longLines.length > 0)
                console.log(`     Long lines: ${longLines.map(l => `L${l.n}(${l.len})`).join(', ')}`);
              console.log('');
            }

            console.log('Action: Review every flagged file before merging.');
            console.log('        False positives → add path to .obfuscation-ignore');
            console.log('        All ignore entries are audited and logged above.');
            process.exit(1);
          }

          console.log('\n✅  Obfuscation scan passed — no suspicious files detected.');
          process.exit(0);
          EOF

      - name: Post detailed failure comment on PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER --repo $REPO --body \
          "## 🚨 Obfuscation / Loader-Rider Scan Failed

          One or more files in this PR triggered the obfuscation gate. Check the **Actions log** for exact file names, pattern IDs, and line numbers.

          ### Detection layers

          **Layer 1 — Fatal patterns** _(single hit = immediate block)_
          | Pattern ID | What it detects |
          |---|---|
          | \`GLOBAL_KEY_INJECT\` | \`global['!']=\` symbol-key injection |
          | \`GLOBAL_REQUIRE_HIJACK\` | \`global[x]=require\` require theft |
          | \`GLOBAL_MODULE_HIJACK\` | \`global[x]=module\` module theft |
          | \`NEW_FUNCTION_CTOR\` | \`new Function(...)\` dynamic code |
          | \`CONSTRUCTOR_CHAIN\` | \`.constructor.constructor(\` prototype escape |
          | \`SETTIMEOUT_STRING_ARG\` | \`setTimeout("...")\` eval-equivalent |
          | \`PROCESS_BINDING\` | \`process.binding()\` Node internals |
          | \`VM_RUN_CONTEXT\` | \`vm.runInNewContext\` sandbox escape |
          | \`CHILD_PROCESS_EXEC\` | Dynamic \`exec/spawn\` argument |
          | \`BUFFER_BASE64_DECODE\` | \`Buffer.from(x,'base64').toString()\` |
          | \`ATOB_PAYLOAD\` | \`atob()\` on non-trivial payload |
          | \`HEX_ESCAPE_CLUSTER\` | 5+ consecutive \`\\xNN\` sequences |
          | \`DYNAMIC_REQUIRE_VAR\` | \`require(variable)\` hidden module name |
          | \`PROTO_POLLUTION\` | \`__proto__\` or \`Object.prototype\` mutation |

          **Layer 2 — Scored patterns** _(threshold: 2 hits = block)_
          \`HEX_VAR_NAME\` · \`SPLIT_JOIN_CHAIN\` · \`FROM_CHAR_CODE\` · \`NUMERIC_CHARCODE_ARRAY\`
          \`SEEDED_IIFE_SHUFFLE\` · \`CHAR_AT_SWAP_LOOP\` · \`DYNAMIC_EVAL_CHAIN\` · \`BASE64_INLINE_BLOB\`
          \`UNICODE_ESCAPE_CLUSTER\` · \`DECODE_URI_PAYLOAD\` · \`UNESCAPE_CALL\` · \`COMPUTED_ARRAY_LOOKUP\`
          \`EVAL_CALL\` · \`DEFINE_GETTER_ABUSE\` · \`ARGUMENTS_CALLEE\`

          **Layer 3 — Shannon entropy** _(> 5.2 on any 512-char window = block)_
          Detects encrypted or compressed payloads that pattern matching alone would miss.

          **Layer 4 — Line length** _(> 500 chars on any single line = block)_
          Detects minified or packed scripts injected inline.

          **Layer 5 — package.json lifecycle hooks**
          Scans \`preinstall\`, \`postinstall\`, \`prepare\` etc. for curl/wget/exec/eval and external URLs.

          ---
          > To whitelist a legitimate false positive, add the file path to \`.obfuscation-ignore\`.
          > Every entry in that file is **logged and audited** in CI — there are no silent exclusions."

  # ─────────────────────────────────────────────
  # JOB 3: Build & Test
  # Runs backend Jest tests + frontend TypeScript build + ESLint.
  # Runs in parallel with obfuscation-scan after commits are verified.
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: verify-commits

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backend — install & test
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Frontend — install, build & lint
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run lint

  # ─────────────────────────────────────────────
  # JOB 4: CodeQL — runs only after all three gates pass
  # ─────────────────────────────────────────────
  security-scan:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    needs: [verify-commits, obfuscation-scan, build-and-test]

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended   # stricter query suite enabled

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"